# 1-bosqich: faqat HTTP (SSL sertifikat hali yo'q).
# Sertifikat olingach .env da NGINX_CONF=https qilib, nginx/https.conf ishlatiladi.

upstream django {
    # "web" — compose'dagi servis nomi, 8000 — Gunicorn porti
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Video va rasm yuklash uchun maksimal hajm
    client_max_body_size 500M;

    # Let's Encrypt tekshiruvi (certbot shu papkaga fayl yozadi)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # collectstatic yig'gan fayllar — nginx o'zi beradi
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Foydalanuvchilar yuklagan fayllar
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # Qolgan hamma so'rovlar Django'ga
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }
}
