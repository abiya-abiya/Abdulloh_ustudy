{% extends 'base.html' %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
    /* Asosiy konteyner */
    .branches-section {
        padding: 2rem;
        background-color: #222530;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        color: white;
    }

    .section-title {
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 1.5rem;
        max-width: 1200px;
        margin-left: auto;
        margin-right: auto;
    }

    /* Xarita va filiallar ro'yxati turadigan asosiy karta */
    .branches-card {
        background-color: #2d323e;
        border-radius: 12px;
        overflow: hidden;
        max-width: 1200px;
        margin: 0 auto;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    /* Xarita qismi */
    #map {
        height: 450px;
        width: 100%;
        background-color: #e5e5e5;
        z-index: 1;
    }

    /* Filiallar ro'yxati qismi */
    .locations-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background-color: #3b404d;
    }

    .location-item {
        background-color: #2d323e;
        padding: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        border-left: 4px solid transparent;
    }

    .location-item:hover {
        background-color: #343a46;
    }

    /* Faol (Tanlangan) filial dizayni */
    .location-item.active {
        border-left: 4px solid #4ade80;
        background-color: #2d323e;
    }

    .location-item h4 {
        margin: 0 0 8px 0;
        font-size: 1.1rem;
        color: #9ca3af;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .location-item.active h4 {
        color: #4ade80;
    }

    .location-item p {
        margin: 0;
        font-size: 0.9rem;
        color: #9ca3af;
        line-height: 1.5;
    }

    .location-item.active p {
        color: #4ade80;
    }

    @media (max-width: 768px) {
        .locations-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="branches-section">
    <h1 class="section-title">Filiallar</h1>

    <div class="branches-card">
        <div id="map"></div>

        <div class="locations-grid">
            {% for branch in branches %}

                <div class="location-item {% if forloop.first %}active{% endif %}"
                     onclick="changeLocation(this, {{ branch.latitude|stringformat:'f' }}, {{ branch.longitude|stringformat:'f' }})">
                    <h4>
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8 0a5.53 5.53 0 0 0-5.5 5.5c0 3.7 4.3 9.4 5.1 10.4a.6.6 0 0 0 .9 0c.8-1 5.1-6.7 5.1-10.4A5.53 5.53 0 0 0 8 0zm0 8a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
                        </svg>
                        {{ branch.name }}
                    </h4>
                    <p>{{ branch.address }}</p>
                </div>

            {% empty %}
                <p style="padding: 20px; color: white;">Hozircha filiallar kiritilmagan. Iltimos Admin paneldan filial qo'shing.</p>
            {% endfor %}
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    {% if branches %}
        var map = L.map('map').setView([{{ branches.0.latitude|stringformat:'f' }}, {{ branches.0.longitude|stringformat:'f' }}], 12);
    {% else %}
        var map = L.map('map').setView([41.311081, 69.240562], 12);
    {% endif %}

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    {% for branch in branches %}
        L.marker([{{ branch.latitude|stringformat:'f' }}, {{ branch.longitude|stringformat:'f' }}])
         .addTo(map)
         .bindPopup("<b>{{ branch.name|escapejs }}</b><br>{{ branch.address|escapejs }}");
    {% endfor %}

    function changeLocation(element, lat, lng) {
        var items = document.querySelectorAll('.location-item');
        items.forEach(function(item) {
            item.classList.remove('active');
        });

        element.classList.add('active');

        map.flyTo([lat, lng], 14);
    }
</script>

{% endblock %}
